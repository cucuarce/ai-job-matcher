name: tests

# Corre en cada push y PR. No necesita Ollama, Groq ni datos reales: los tests
# usan proveedores fake y el único que depende del dataset (data/raw/ofertas.json,
# que no está en el repo) se omite solo. Ver "Nota sobre los datos" en el README.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests
        # "python -m pytest", no "pytest" a secas: -m agrega el directorio actual (la raíz del repo,
        # donde vive src/) al sys.path. Sin eso, conftest.py falla con "No module named 'src'".
        run: python -m pytest -v
